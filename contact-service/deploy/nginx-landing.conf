# umtelkomd.net — installed as /etc/nginx/sites-available/landing.conf by deploy-site.sh.
# Based on the live file read on 2026-11-09 (nginx 1.28.3). Certbot lines are kept as Certbot wrote them.
server {
  server_name umtelkomd.net;
  http2 on;

  root /var/www/landing;
  index index.html;
  include /etc/nginx/snippets/umtelkomd-security-headers.conf;

  # nginx compresses only text/html by default
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
  gzip_min_length 1024;
  gzip_vary on;

  error_page 404 /404.html;
  location = /404.html {
    internal;
    include /etc/nginx/snippets/umtelkomd-security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  # dotfiles (backups such as .index.html.bak-*) are never served; /.well-known/ is
  location ~ /\.(?!well-known/) { return 404; }

  # Browsers that still hold the pre-November React site in their cache (it was served without
  # cache headers, so they may reuse it for weeks) request these files when they show it.
  # The answer tells them to drop everything cached for this origin; the next visit loads the current site.
  location = /manifest.json { include /etc/nginx/snippets/umtelkomd-security-headers.conf; add_header Clear-Site-Data '"cache"' always; default_type text/plain; return 404 "gone\n"; }
  location ^~ /static/      { include /etc/nginx/snippets/umtelkomd-security-headers.conf; add_header Clear-Site-Data '"cache"' always; default_type text/plain; return 404 "gone\n"; }

  # fonts never change
  location ^~ /assets/fonts/ {
    location ~ /\. { return 404; }   # a prefix location with ^~ skips the server-level dotfile rule
    include /etc/nginx/snippets/umtelkomd-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  # stylesheets and scripts: the pages reference them with a content hash (?v=...)
  location ~* \.(?:js|mjs|css)$ {
    include /etc/nginx/snippets/umtelkomd-security-headers.conf;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }
  # images: file names are not hashed
  location ~* \.(?:png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
    include /etc/nginx/snippets/umtelkomd-security-headers.conf;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # E-mail signature pages: staff open them to copy a signature, and e-mail HTML needs inline styles.
  # Same headers as the snippet, except style-src; kept out of search engines.
  location ^~ /signatur/ {
    location ~ /\. { return 404; }   # a prefix location with ^~ skips the server-level dotfile rule
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # Contact form relay (contact-service on 127.0.0.1:8787)
  include /etc/nginx/snippets/umtelkomd-contact.conf;

  location / {
    # HTML is always revalidated, so visitors never see an old version of the site
    include /etc/nginx/snippets/umtelkomd-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;   # unknown addresses get the 404 page, not the home page
  }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/umtelkomd.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/umtelkomd.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
# www -> apex, one address for the site
server {
  server_name www.umtelkomd.net;
  http2 on;
  listen 443 ssl;
  ssl_certificate /etc/letsencrypt/live/umtelkomd.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/umtelkomd.net/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
  include /etc/nginx/snippets/umtelkomd-security-headers.conf;
  return 301 https://umtelkomd.net$request_uri;
}
server {
  listen 80;
  server_name umtelkomd.net www.umtelkomd.net;
  return 301 https://umtelkomd.net$request_uri;
}
