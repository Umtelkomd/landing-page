# Include inside the umtelkomd.net server { } block.
# Rate-limit zone must live in the http { } context, e.g. /etc/nginx/conf.d/contact-zone.conf:
#   limit_req_zone $binary_remote_addr zone=contact:1m rate=10r/m;

location = /api/contact {
    limit_except POST { deny all; }
    limit_req zone=contact burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 6m;
    # When nginx itself rejects, answer in the service's JSON format.
    error_page 413 @contact_too_large;
    error_page 429 @contact_rate_limited;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;   # overwrites any client-sent value
    proxy_read_timeout 30s;                     # service: 15s per client read, 10s per SMTP step
    access_log off;                             # no IPs of form senders in nginx logs
}

location @contact_too_large {
    default_type application/json;
    add_header Cache-Control no-store always;
    return 413 '{"ok":false,"error":"too_large"}';
}

location @contact_rate_limited {
    default_type application/json;
    add_header Cache-Control no-store always;
    return 429 '{"ok":false,"error":"rate_limited"}';
}
