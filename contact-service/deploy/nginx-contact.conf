# Include inside the umtelkomd.net server { } block.
# Rate-limit zone must live in the http { } context, e.g. /etc/nginx/conf.d/contact-zone.conf:
#   limit_req_zone $binary_remote_addr zone=contact:1m rate=10r/m;

location = /api/contact {
    limit_except POST { deny all; }
    limit_req zone=contact burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 6m;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;   # overwrites any client-sent value
    proxy_read_timeout 30s;
    access_log off;                             # no IPs of form senders in nginx logs
}
